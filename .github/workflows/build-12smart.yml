name: Build 12 Smart APK
on:
  push:
    branches: ["12-smart-build"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: smart12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 12Smart-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 12Smart-Android-APK
          path: smart12/12Smart-Android.apk
          retention-days: 30
